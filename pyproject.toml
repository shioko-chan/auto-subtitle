[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-bilibili-pipeline"
version = "0.1.0"
description = "Download YouTube videos, translate/generate subtitles, and upload to Bilibili"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.1.31",
    "yt-dlp[default,curl-cffi]>=2025.1.15",
]

[project.optional-dependencies]
asr = [
    "demucs>=4,<5",
    "librosa>=0.11,<1",
    "pyannote-audio>=4,<5",
    "qwen-asr>=0.0.6,<0.1",
    "speechbrain>=1,<2",
]

[project.scripts]
subtitle-pipeline = "subtitle_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
