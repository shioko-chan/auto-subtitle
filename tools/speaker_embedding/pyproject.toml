[project]
name = "subtitle-speaker-embedding-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "funasr>=1.3.9,<2",
    "modelscope>=1,<2",
    "soundfile>=0.13,<1",
    "torch==2.8.0+cpu",
    "torchaudio==2.8.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
