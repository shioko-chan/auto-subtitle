work_dir = "work"

[download]
# Prefer formats supported by NVDEC on Turing GPUs; fall back to any combined stream.
video_format = "bv*[vcodec^=vp9]+ba/bv*[vcodec^=vp09]+ba/bv*[vcodec^=avc1]+ba/b"
# Download DASH/HLS fragments in parallel. Plain single-file streams ignore this.
concurrent_fragments = 8
# Download chat replay as temporary, time-local evidence for ASR correction and translation.
download_chat_replay = true
# Fetch a bounded set of top-level comments sorted by YouTube's "Top comments" order.
# Retained comments are low-trust RAG background, not authoritative facts.
download_top_comments = true
top_comment_fetch_limit = 100
top_comment_min_likes = 10
top_comment_background_limit = 30
# Automatically use Deno, Node or QuickJS when available; set "" to disable.
js_runtime = "auto"
# cookies_from_browser = "chrome"
# cookies_file = "/path/to/youtube-cookies.txt"

[asr]
model = "Qwen/Qwen3-ASR-1.7B"
aligner_model = "Qwen/Qwen3-ForcedAligner-0.6B"
# Lyrics-only Whisper model used on Demucs vocal stems. Ordinary speech and
# forced alignment continue to use the Qwen models above.
singing_model = "HeartMuLa/HeartTranscriptor-oss"
singing_max_new_tokens = 256
singing_num_beams = 2
device = "cuda:0"
# RTX 20 系显卡不支持 bfloat16，使用 float16。
dtype = "float16"
# Leave language unset to let Qwen detect it for each ASR window.
# context = "BanG Dream!、夢限大みゅーたいぷ、MewTypeに関する日本語配信。"
# 每块连同两侧上下文必须不超过 forced aligner 的 180 秒限制。
chunk_seconds = 170.0
chunk_context_seconds = 0.5
# Repeated ASR generation is detected automatically. Affected chunks are
# recursively halved down to about 20 seconds instead of being cached.
max_inference_batch_size = 4
max_new_tokens = 2048
speech_window_target_seconds = 60.0
speech_window_max_seconds = 90.0
speech_window_max_gap_seconds = 2.0
speech_window_max_silence_seconds = 15.0
speech_window_min_coverage = 0.6

[audio_analysis]
# Run VAD/diarization and singing detection before Qwen ASR. Gated pyannote
# models require an authenticated Hugging Face account with accepted terms.
enabled = true
# Persist separated WAV files for inspection; normal runs keep them in shared memory.
debug_audio_artifacts = false
# Set to 2 only after confirming concurrent diarization + AST fits GPU memory.
initial_analysis_concurrency = 1
diarization_backend = "pyannote"
# Community-1 supplies both ordinary overlap-preserving diarization and an
# exclusive timeline for baseline ASR. Overlap duration always refers to the
# real ordinary-timeline intersection, before context padding.
diarization_model = "pyannote/speaker-diarization-community-1"
overlap_conditioned_asr_seconds = 0.5
overlap_context_seconds = 2.0
conditioned_asr_backend = "dicow"
conditioned_asr_model = "BUT-FIT/DiCoW_v3_3"
# Pin trusted remote model code instead of executing a moving main branch.
conditioned_asr_revision = "c34b64d9a9c5148c65fd355bb188d60343a6b44f"
conditioned_asr_worker_project = "tools/dicow"
conditioned_asr_batch_size = 4
# MOSS jointly produces the spoken transcript and anonymous speaker timeline.
# It remains available as a slower comparison backend.
moss_transcribe_model = "OpenMOSS-Team/MOSS-Transcribe-Diarize"
moss_transcribe_worker_project = "tools/moss_transcribe"
# Bound attention memory on consumer GPUs. Split near the quietest point around
# each eight-minute target; no inference window may exceed nine minutes.
moss_window_seconds = 480.0
moss_max_window_seconds = 540.0
moss_window_search_seconds = 60.0
# An eight-minute transcript should fit comfortably; this cap prevents a
# malformed generation from decoding tens of thousands of tokens.
moss_max_new_tokens = 8192
speaker_embedding_backend = "eres2netv2"
speaker_embedding_model = "iic/speech_eres2netv2_sv_zh-cn_16k-common"
speaker_embedding_worker_project = "tools/speaker_embedding"
singing_model = "MIT/ast-finetuned-audioset-10-10-0.4593"
device = "cuda:0"
singing_window_seconds = 5.0
singing_stride_seconds = 2.5
singing_threshold = 0.015
# Music cannot start a song by itself, but it keeps a confirmed performance
# active through calls, instrumental passages and short in-song speech.
singing_music_threshold = 0.05
# Speech at or above this score is strong evidence and independently enables
# speech ASR, even when the same phrase also routes through ALT.
singing_speech_takeover_threshold = 0.5
# Smooth isolated AST misses/hits and merge only nearby candidate windows.
singing_merge_gap_seconds = 1.5
singing_smoothing_windows = 3
singing_phrase_silence_seconds = 0.45
# Adaptive offline singing ASR windows. Short acoustic phrases reduce language
# switching inside a window. Prefer a non-singing vocal gap, then a vocal-energy
# valley, then a phrase boundary.
singing_asr_target_seconds = 10.0
singing_asr_min_seconds = 6.0
singing_asr_max_seconds = 15.0
singing_asr_search_seconds = 4.0
singing_asr_overlap_seconds = 1.0
speaker_profiles_dir = "work/speaker-profiles-eres2netv2"
speaker_match_threshold = 0.42
speaker_match_margin = 0.025
# Resolve every MOSS anonymous speaker independently. Discard the farthest 15%
# of segment evidence, then weight retained evidence by up to 10 seconds each.
speaker_identity_trim_ratio = 0.15
speaker_identity_max_weight_seconds = 10.0
speaker_identity_edge_trim_seconds = 0.15
speaker_identity_min_segment_seconds = 1.5
speaker_enrollment_samples_per_video = 40
# Preserve distinct speaking conditions instead of averaging the whole profile.
speaker_profile_max_centers = 5
speaker_profile_min_samples_per_center = 20
# Rendering/training metadata is separate from the LLM glossary.
# character_styles_file = "character-styles.json"

[song_identification]
# OCR one frame per search group only for titles that explicitly describe music.
enabled = true
device = "cuda:0"
search_worker_project = "tools/song_search"
song_search_group_gap_seconds = 35.0
minimum_ocr_score = 0.45
max_search_results = 5
lyrics_library_path = "databases/lyrics.sqlite3"
match_anchor_threshold = 0.48
match_minimum_anchors = 3
match_minimum_score = 0.48
pyshiro_worker_project = "tools/pyshiro"
# Used only after a song is confirmed and a lyric gap has no existing stem.
vocal_separation_device = "cuda:0"
# pySHIRO recommends short singing windows and must never receive more than 20s.
pyshiro_max_window_seconds = 20.0
lyric_gap_recheck_seconds = 20.0
lyric_gap_vocal_active_ratio = 0.08
pyshiro_likelihood_floor = -30.0
pyshiro_gap_likelihood_margin = 0.1
pyshiro_likelihood_margin = 0.2
lyric_neighbor_max_lines = 12
lyric_neighbor_min_coverage = 0.45

[asr_correction]
# Adjacent ASR records share one continuous correction window up to this size.
window_chars = 3000
max_tokens = 8192

[segmentation]
boundary_score_threshold = 3
local_unit_min_fallback_seconds = 2.0
local_unit_max_seconds = 6.0
speaker_episode_gap_seconds = 2.0
model_window_units = 240
model_window_chars = 3000

[translation]
target_language = "简体中文"
batch_cues = 32
batch_chars = 3000
max_tokens = 8192
context_before_seconds = 20.0
context_after_seconds = 10.0
context_max_chars = 4000
# Loaded lazily when a single-unit LLM translation fails validation after retries.
local_model = "facebook/m2m100_418M"
local_device = "cpu"
translate_metadata = true
# Only this many source-description characters are sent to the LLM.
metadata_description_max_chars = 6000
# Number of Bilibili tags generated in the same metadata request.
metadata_tag_count = 5
# Beginning/middle/end subtitle evidence supplied to metadata analysis.
metadata_subtitle_max_chars = 4000
# ip_aliases_file = "ip_aliases.json"
# Additional glossary files override matching terms in built-in glossaries.
glossary_files = []

[fan_knowledge]
# Local, reusable fan-domain knowledge base. Retrieval details for each job are
# written to work/<job-id>/fan-knowledge-audit.jsonl.
enabled = true
database_path = "databases/fan-knowledge.sqlite3"
collection_cache_dir = "work/knowledge/youtube"
chunk_target_seconds = 45.0
chunk_max_chars = 1400
youtube_subtitle_languages = ["ja.*", "ja", "en.*", "en"]
# Full chat is temporary: SC is indexed, then the raw chat replay is deleted.
include_regular_chat = false
current_video_chat_lookback_seconds = 30.0
current_video_chat_lookahead_seconds = 15.0
top_k_asr = 6
top_k_translation = 12
translation_query_chars = 12000
auto_update_enabled = true
update_interval_hours = 24
youtube_playlist_limit = 10000
youtube_sources = [
  "https://www.youtube.com/@arale_yumemita/videos",
  "https://www.youtube.com/@nonoka_yumemita/videos",
  "https://www.youtube.com/@ritsu_yumemita/videos",
  "https://www.youtube.com/@miyako_yumemita/videos",
  "https://www.youtube.com/@yuno_yumemita/videos",
  "https://www.youtube.com/@BDP_yumemita/videos",
  "https://www.youtube.com/@arale_yumemita/streams",
  "https://www.youtube.com/@nonoka_yumemita/streams",
  "https://www.youtube.com/@ritsu_yumemita/streams",
  "https://www.youtube.com/@miyako_yumemita/streams",
  "https://www.youtube.com/@yuno_yumemita/streams",
  "https://www.youtube.com/@BDP_yumemita/streams",
]
official_sources = [
  "https://bang-dream.com/news/",
  "https://bang-dream.com/events/",
  "https://bushiroad-music.com/artists/yumemita/",
]
sns_sources = [
  "https://x.com/BDP_yumemita",
  "https://x.com/arale_yumemita",
  "https://x.com/nonoka_yumemita",
  "https://x.com/ritsu_yumemita",
  "https://x.com/miyako_yumemita",
  "https://x.com/yuno_yumemita",
  "https://www.instagram.com/arale_yumemita/",
  "https://www.instagram.com/nonochantime_yumemita/",
  "https://www.instagram.com/ritsu_mgmg/",
  "https://www.instagram.com/38_385_popo/",
  "https://www.instagram.com/yunoch1/",
]
embedding_model = "intfloat/multilingual-e5-base"
# FAISS vectors, model and document IDs are committed as one SQLite snapshot.
vector_index_path = "databases/fan-knowledge-vectors.sqlite3"
vector_minimum_score = 0.62
reranker_model = "BAAI/bge-reranker-v2-m3"
reranker_minimum_score = 0.05
# DeepSeek term extraction uses larger timeline batches than translation.
term_extraction_context_size = 262144
term_extraction_target_input_tokens = 220000
term_extraction_max_output_tokens = 16384

[llm]
base_url = "http://127.0.0.1:8080/v1"
api_style = "chat_completions"
api_key_pass_entry = ""
api_key_env = "LOCAL_LLM_API_KEY"
model = "Qwen3.8-27B"
timeout_seconds = 120
max_retries = 5
max_concurrency = 3
# llama.cpp starts after ALT/song verification for ASR correction and remains
# loaded while the forced aligner and later language stages run.
local_server_enabled = true
local_server_command = "llama-server"
local_server_hf_repo = "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M"
# For a manually downloaded file, remove local_server_hf_repo and use:
# local_server_model_path = "models/Qwen3.8-27B-UD-Q4_K_M.gguf"
local_server_host = "127.0.0.1"
local_server_port = 8080
local_server_context_size = 16384
local_server_gpu_layers = 56
local_server_parallel = 3
local_server_reasoning = "off"
local_server_startup_timeout_seconds = 1800
# All LLM tasks require strict JSON Schema structured outputs.
# Remote providers must support response_format.json_schema (Chat Completions)
# or text.format.json_schema (Responses), in addition to streaming.
# OpenAI Responses API example:
# base_url = "https://api.openai.com/v1"
# api_style = "responses"
# api_key_pass_entry = "api/openai"
# api_key_env = "OPENAI_API_KEY"
# model = "gpt-5.6"
# Remove `thinking` above when using Responses. Optionally set:
# reasoning_effort = "low"

[render]
# auto tries the sparse libass/CUDA/NVENC renderer and falls back to CPU libass.
backend = "auto"
font_name = "Noto Sans CJK SC"
# Font size is this fraction of the video's short edge, clamped below.
font_size_ratio = 0.066
portrait_font_size_ratio = 0.077
min_font_size = 28
max_font_size = 144
margin_horizontal_ratio = 0.075
portrait_margin_horizontal_ratio = 0.025
margin_vertical_ratio = 0.05
outline_ratio = 0.0045
crf = 20
preset = "medium"
nvenc_preset = "p4"
nvenc_cq = 20

[upload]
# Keep false until `biliup login` has produced the cookie file and a dry run succeeds.
enabled = false
cookie_file = "cookies.json"
copyright = 2
tid_v2 = 2047
tags = ["中文字幕", "YouTube"]
max_tags = 10
# Import a tag/heat catalog obtained through an authorized source.
# tag_catalog_file = "bilibili-tags.json"
title_prefix = "【中字】"
description_prefix = "翻译：Qwen，时轴：Qwen\n请以原视频为准：\n{youtube_url}\n─────── ⋆⋅☆⋅⋆ ───────\n\n"
description_max_chars = 1800
# line = "kodo"
limit = 3
cooldown_min_seconds = 60
cooldown_max_seconds = 120
rate_limit_retry_delays_seconds = [120, 300, 600, 1200]
throttle_state_file = "work/bilibili-upload-throttle.json"
pause_marker_file = "work/bilibili-upload-paused.json"
# Five minutes after a successful upload, automatically post a top-level
# setlist comment when the original YouTube title contains the literal "歌枠".
song_setlist_comment = true

[clips]
# Independent from upload.enabled; clips also accepts --upload/--no-upload.
upload = false
max_speech_seconds = 480
chat_peak_zscore = 3.0
chat_min_unique_authors = 5
