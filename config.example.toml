work_dir = "work"

[download]
# Automatically use Deno, Node or QuickJS when available; set "" to disable.
js_runtime = "auto"
# cookies_from_browser = "chrome"
# cookies_file = "/path/to/youtube-cookies.txt"

[asr]
model = "Qwen/Qwen3-ASR-1.7B"
aligner_model = "Qwen/Qwen3-ForcedAligner-0.6B"
device = "cuda:0"
# RTX 20 系显卡不支持 bfloat16，使用 float16。
dtype = "float16"
language = "Japanese"
# context = "BanG Dream!、夢限大みゅーたいぷ、MewTypeに関する日本語配信。"
# 每块连同两侧上下文必须不超过 forced aligner 的 180 秒限制。
chunk_seconds = 170.0
chunk_context_seconds = 2.0
# Repeated ASR generation is detected automatically. Affected chunks are
# recursively halved down to about 20 seconds instead of being cached.
max_inference_batch_size = 1
max_new_tokens = 2048

[audio_analysis]
# Run VAD/diarization and singing detection before Qwen ASR. Gated pyannote
# models require an authenticated Hugging Face account with accepted terms.
enabled = true
diarization_model = "pyannote/speaker-diarization-community-1"
overlap_embedding_model = "pyannote/wespeaker-voxceleb-resnet34-LM"
speaker_embedding_backend = "eres2netv2"
speaker_embedding_model = "iic/speech_eres2netv2_sv_zh-cn_16k-common"
speaker_embedding_worker_project = "tools/speaker_embedding"
overlap_separation_model = "pyannote/separation-ami-1.0"
singing_model = "MIT/ast-finetuned-audioset-10-10-0.4593"
device = "cuda:0"
singing_window_seconds = 5.0
singing_stride_seconds = 2.5
singing_threshold = 0.05
# Raw AST only proposes candidates. Vocal-stem AST confirms actual singing;
# speech-heavy candidates without vocal singing remain ordinary speech+BGM.
singing_vocal_threshold = 0.5
singing_speech_bgm_coverage = 0.35
singing_ambiguous_min_seconds = 15.0
# Smooth isolated AST misses/hits, then keep the song state through short gaps.
singing_merge_gap_seconds = 1.5
singing_smoothing_windows = 3
singing_release_seconds = 35.0
singing_phrase_silence_seconds = 0.45
# Confirmed songs and sentence-level singing ASR blocks must span at least this
# long. Short vocal fragments are merged; short candidate episodes use dual ASR.
singing_min_phrase_seconds = 30.0
singing_asr_window_seconds = 12.0
singing_asr_overlap_seconds = 2.0
speaker_profiles_dir = "work/speaker-profiles-eres2netv2"
speaker_match_threshold = 0.32
speaker_overlap_match_threshold = 0.24
speaker_match_margin = 0.03
speaker_enrollment_samples_per_video = 40
# Preserve distinct speaking conditions instead of averaging the whole profile.
speaker_profile_max_centers = 5
speaker_profile_min_samples_per_center = 20
# Rendering/training metadata is separate from the LLM glossary.
# character_styles_file = "character-styles.json"

[song_identification]
# Inspect only the short interval around each detected start of singing.
enabled = true
device = "gpu:0"
detection_model = "PP-OCRv5_mobile_det"
recognition_model = "PP-OCRv5_server_rec"
ocr_worker_project = "tools/song_ocr"
search_worker_project = "tools/song_search"
seconds_before_start = 30.0
seconds_after_start = 15.0
sample_interval_seconds = 1.0
song_gap_seconds = 35.0
minimum_ocr_score = 0.45
minimum_persistent_frames = 2
max_tool_calls = 6
max_search_results = 5
max_page_chars = 12000

[segmentation]
# Each request initially adds this many forced-aligner units. The final cue is
# always carried into the next request, so the window edge is never a cue boundary.
model_window_cues = 600

[llm]
base_url = "https://api.deepseek.com"
api_key_pass_entry = "api/deepseek"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"
target_language = "简体中文"
batch_size = 30
timeout_seconds = 120
max_retries = 5
max_tokens = 16384
context_cues = 3
# Joint subtitles and metadata use json_object; legacy per-ID translation keeps NDJSON.
# Set false if an OpenAI-compatible provider rejects response_format=json_object.
json_mode = true
# DeepSeek V4 defaults to thinking mode, which is slow and unreliable for strict JSON.
# Omit this option for providers that do not implement the DeepSeek thinking parameter.
thinking = "disabled"
translate_metadata = true
# Only this many source-description characters are sent to the LLM.
metadata_description_max_chars = 6000
# Number of Bilibili tags generated in the same metadata request.
metadata_tag_count = 5
# Beginning/middle/end subtitle evidence supplied to metadata analysis.
metadata_subtitle_max_chars = 4000
# ip_aliases_file = "ip_aliases.json"
# Additional glossary files override matching terms in built-in glossaries.
glossary_files = []

[render]
font_name = "Noto Sans CJK SC"
# Font size is this fraction of the video's short edge, clamped below.
font_size_ratio = 0.066
portrait_font_size_ratio = 0.077
min_font_size = 28
max_font_size = 144
margin_horizontal_ratio = 0.075
portrait_margin_horizontal_ratio = 0.025
margin_vertical_ratio = 0.05
outline_ratio = 0.003
crf = 20
preset = "medium"

[upload]
# Keep false until `biliup login` has produced the cookie file and a dry run succeeds.
enabled = false
cookie_file = "cookies.json"
copyright = 2
tid = 171
tags = ["中文字幕", "YouTube"]
max_tags = 10
# Import a tag/heat catalog obtained through an authorized source.
# tag_catalog_file = "bilibili-tags.json"
source = ""
title_prefix = "【中字】"
description_suffix = "\n\n字幕由自动化工具生成，请以原视频为准。"
# line = "kodo"
limit = 3
