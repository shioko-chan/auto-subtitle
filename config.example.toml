work_dir = "work"

[download]
# Prefer formats supported by NVDEC on Turing GPUs; fall back to any combined stream.
video_format = "bv*[vcodec^=vp9]+ba/bv*[vcodec^=vp09]+ba/bv*[vcodec^=avc1]+ba/b"
# Automatically use Deno, Node or QuickJS when available; set "" to disable.
js_runtime = "auto"
# cookies_from_browser = "chrome"
# cookies_file = "/path/to/youtube-cookies.txt"

[asr]
model = "Qwen/Qwen3-ASR-1.7B"
aligner_model = "Qwen/Qwen3-ForcedAligner-0.6B"
device = "cuda:0"
# RTX 20 系显卡不支持 bfloat16，使用 float16。
dtype = "float16"
language = "Japanese"
# context = "BanG Dream!、夢限大みゅーたいぷ、MewTypeに関する日本語配信。"
# 每块连同两侧上下文必须不超过 forced aligner 的 180 秒限制。
chunk_seconds = 170.0
chunk_context_seconds = 2.0
# Repeated ASR generation is detected automatically. Affected chunks are
# recursively halved down to about 20 seconds instead of being cached.
max_inference_batch_size = 4
max_new_tokens = 2048
speech_window_target_seconds = 60.0
speech_window_max_seconds = 90.0
speech_window_max_gap_seconds = 2.0
speech_window_max_silence_seconds = 15.0
speech_window_min_coverage = 0.6

[audio_analysis]
# Run VAD/diarization and singing detection before Qwen ASR. Gated pyannote
# models require an authenticated Hugging Face account with accepted terms.
enabled = true
# Persist separated WAV files for inspection; normal runs keep them in shared memory.
debug_audio_artifacts = false
# Set to 2 only after confirming concurrent diarization + AST fits GPU memory.
initial_analysis_concurrency = 1
diarization_backend = "pyannote"
# Community-1 supplies both ordinary overlap-preserving diarization and an
# exclusive timeline for baseline ASR. Overlap duration always refers to the
# real ordinary-timeline intersection, before context padding.
diarization_model = "pyannote/speaker-diarization-community-1"
overlap_conditioned_asr_seconds = 0.5
overlap_context_seconds = 2.0
conditioned_asr_backend = "dicow"
conditioned_asr_model = "BUT-FIT/DiCoW_v3_3"
# Pin trusted remote model code instead of executing a moving main branch.
conditioned_asr_revision = "c34b64d9a9c5148c65fd355bb188d60343a6b44f"
conditioned_asr_worker_project = "tools/dicow"
conditioned_asr_batch_size = 4
# MOSS jointly produces the spoken transcript and anonymous speaker timeline.
# It remains available as a slower comparison backend.
moss_transcribe_model = "OpenMOSS-Team/MOSS-Transcribe-Diarize"
moss_transcribe_worker_project = "tools/moss_transcribe"
# Bound attention memory on consumer GPUs. Split near the quietest point around
# each eight-minute target; no inference window may exceed nine minutes.
moss_window_seconds = 480.0
moss_max_window_seconds = 540.0
moss_window_search_seconds = 60.0
# An eight-minute transcript should fit comfortably; this cap prevents a
# malformed generation from decoding tens of thousands of tokens.
moss_max_new_tokens = 8192
# Kept only for compatibility with older configs; MossFormer2 does not use it.
overlap_embedding_model = "pyannote/wespeaker-voxceleb-resnet34-LM"
speaker_embedding_backend = "eres2netv2"
speaker_embedding_model = "iic/speech_eres2netv2_sv_zh-cn_16k-common"
speaker_embedding_worker_project = "tools/speaker_embedding"
overlap_separation_model = "MossFormer2_SS_16K"
overlap_separation_worker_project = "tools/mossformer2"
singing_model = "MIT/ast-finetuned-audioset-10-10-0.4593"
device = "cuda:0"
singing_window_seconds = 5.0
singing_stride_seconds = 2.5
singing_threshold = 0.05
# Raw AST only proposes candidates. Vocal-stem AST confirms actual singing;
# speech-heavy candidates without vocal singing remain ordinary speech+BGM.
singing_vocal_threshold = 0.5
singing_speech_bgm_coverage = 0.35
singing_ambiguous_min_seconds = 15.0
# Smooth isolated AST misses/hits, then keep the song state through short gaps.
singing_merge_gap_seconds = 1.5
singing_smoothing_windows = 3
singing_release_seconds = 35.0
singing_phrase_silence_seconds = 0.45
# Confirmed songs and sentence-level singing ASR blocks must span at least this
# long. Short vocal fragments are merged; short candidate episodes use dual ASR.
singing_min_phrase_seconds = 30.0
singing_asr_window_seconds = 12.0
singing_asr_overlap_seconds = 2.0
speaker_profiles_dir = "work/speaker-profiles-eres2netv2"
speaker_match_threshold = 0.40
speaker_overlap_match_threshold = 0.24
speaker_match_margin = 0.03
# Resolve every MOSS anonymous speaker independently. Discard the farthest 15%
# of segment evidence, then weight retained evidence by up to 10 seconds each.
speaker_identity_trim_ratio = 0.15
speaker_identity_max_weight_seconds = 10.0
speaker_identity_edge_trim_seconds = 0.15
speaker_identity_min_segment_seconds = 1.5
speaker_enrollment_samples_per_video = 40
# Preserve distinct speaking conditions instead of averaging the whole profile.
speaker_profile_max_centers = 5
speaker_profile_min_samples_per_center = 20
# Rendering/training metadata is separate from the LLM glossary.
# character_styles_file = "character-styles.json"

[song_identification]
# Inspect only the short interval around each detected start of singing.
enabled = true
device = "gpu:0"
detection_model = "PP-OCRv5_mobile_det"
recognition_model = "PP-OCRv5_server_rec"
ocr_worker_project = "tools/song_ocr"
search_worker_project = "tools/song_search"
seconds_before_start = 30.0
seconds_after_start = 15.0
sample_interval_seconds = 1.0
song_gap_seconds = 35.0
minimum_ocr_score = 0.45
minimum_persistent_frames = 2
max_tool_calls = 6
max_search_results = 5
max_page_chars = 12000

[segmentation]
# Target number of forced-aligner units in each independent parallel request.
# Ranges may be rebalanced so no multi-window job ends with a one-unit window.
model_window_cues = 600

[llm]
base_url = "https://api.deepseek.com"
api_style = "chat_completions"
api_key_pass_entry = "api/deepseek"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"
target_language = "简体中文"
timeout_seconds = 120
max_retries = 5
max_concurrency = 16
max_tokens = 16384
context_cues = 3
# Joint subtitles and metadata use json_object.
# Set false if an OpenAI-compatible provider rejects response_format=json_object.
json_mode = true
# DeepSeek V4 defaults to thinking mode, which is slow and unreliable for strict JSON.
# Omit this option for providers that do not implement the DeepSeek thinking parameter.
thinking = "disabled"
# OpenAI Responses API example:
# base_url = "https://api.openai.com/v1"
# api_style = "responses"
# api_key_pass_entry = "api/openai"
# api_key_env = "OPENAI_API_KEY"
# model = "gpt-5.6"
# Remove `thinking` above when using Responses. Optionally set:
# reasoning_effort = "low"
translate_metadata = true
# Only this many source-description characters are sent to the LLM.
metadata_description_max_chars = 6000
# Number of Bilibili tags generated in the same metadata request.
metadata_tag_count = 5
# Beginning/middle/end subtitle evidence supplied to metadata analysis.
metadata_subtitle_max_chars = 4000
# ip_aliases_file = "ip_aliases.json"
# Additional glossary files override matching terms in built-in glossaries.
glossary_files = []

[render]
# auto tries the sparse libass/CUDA/NVENC renderer and falls back to CPU libass.
backend = "auto"
font_name = "Noto Sans CJK SC"
# Font size is this fraction of the video's short edge, clamped below.
font_size_ratio = 0.066
portrait_font_size_ratio = 0.077
min_font_size = 28
max_font_size = 144
margin_horizontal_ratio = 0.075
portrait_margin_horizontal_ratio = 0.025
margin_vertical_ratio = 0.05
outline_ratio = 0.003
crf = 20
preset = "medium"
nvenc_preset = "p4"
nvenc_cq = 23

[upload]
# Keep false until `biliup login` has produced the cookie file and a dry run succeeds.
enabled = false
cookie_file = "cookies.json"
copyright = 2
tid = 171
tags = ["中文字幕", "YouTube"]
max_tags = 10
# Import a tag/heat catalog obtained through an authorized source.
# tag_catalog_file = "bilibili-tags.json"
source = ""
title_prefix = "【中字】"
description_suffix = "\n\n字幕由自动化工具生成，请以原视频为准。"
# Keep a margin below Bilibili's nominal limit; truncation preserves the suffix.
description_max_chars = 1800
# line = "kodo"
limit = 3
cooldown_min_seconds = 60
cooldown_max_seconds = 120
rate_limit_retry_delays_seconds = [120, 300, 600, 1200]
throttle_state_file = "work/bilibili-upload-throttle.json"
pause_marker_file = "work/bilibili-upload-paused.json"
